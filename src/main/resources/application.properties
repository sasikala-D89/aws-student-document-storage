# --- Server ---
server.port=8000

# --- Database (file-based H2, holds only the users table) ---
spring.datasource.url=jdbc:h2:file:./data/studentdocs;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- File uploads ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- AWS ---
# Set these as real environment variables in production (see deploy/studentdocs.service).
studentdocs.bucket=${STUDENTDOCS_BUCKET:}
aws.region=${AWS_REGION:us-east-1}

# --- Logging ---
logging.file.name=${STUDENTDOCS_LOG_FILE:studentdocs.log}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
